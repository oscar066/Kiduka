events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream client_upstream {
        server client:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost; # Change this to your domain in production if needed, or keep localhost for generic catch-all

        # Frontend
        location / {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # NextAuth Routes - Specific endpoints handled by Next.js
        location ~ ^/api/auth/(session|csrf|providers|callback|signin|signout|error|_log) {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        # Assuming the client calls /api/... or we proxy /api to the backend
        # If the backend is hosted at /api, we need to make sure the backend handles that prefix or we rewrite it.
        # Based on typical setups, we'll proxy /api/ to the backend.
        location /api/ {
            # Rewrite /api/(.*) to /$1 break; # Uncomment if backend doesn't expect /api prefix
            # However, usually it's better to keep /api if the backend is namespaced or just proxy pass directly if backend handles it.
            # Let's assume we just proxy pass to the root of the api service for now, but usually /api is a route in the backend or we strip it.
            # If the backend has routes like /users, /items, then /api/users -> /users
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Docs for API (Optional)
        location /docs {
            proxy_pass http://api_upstream/docs;
            proxy_set_header Host $host;
        }
        
        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
