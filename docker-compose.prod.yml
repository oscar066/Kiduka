services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agricultural_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.server-certificates:/etc/nginx/ssl:ro
    depends_on:
      - client
      - api
    networks:
      - agri-network
    restart: always

  # Next.js Client
  client:
    build:
      context: ./client/kiduka-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        API_URL: http://api:8000
    container_name: agricultural_client_prod
    networks:
      - agri-network
    environment:
      - API_URL=http://api:8000
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - api
    restart: always

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: agricultural_api_prod
    volumes:
      - ./api:/app/api
      - ./chatbot:/app/chatbot
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - agri-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agricultural_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrate_to_rbac.sql:/docker-entrypoint-initdb.d/02-migrate.sql
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

networks:
  agri-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
