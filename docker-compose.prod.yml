services:
  # Next.js Client — binds to 127.0.0.1:3000 so only host nginx can reach it
  client:
    build:
      context: ./client/kiduka-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        API_URL: http://api:8000
    container_name: agricultural_client_prod
    environment:
      - API_URL=http://api:8000
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - agri-network
    restart: always

  # FastAPI Backend — binds to 127.0.0.1:8000
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: agricultural_api_prod
    volumes:
      - ./api:/app/api
      - ./chatbot:/app/chatbot
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agri-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agricultural_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrate_to_rbac.sql:/docker-entrypoint-initdb.d/02-migrate.sql
      - ./database/update_soil_predictions.sql:/docker-entrypoint-initdb.d/03-update-predictions.sql
      - ./database/migrate_cdc.sql:/docker-entrypoint-initdb.d/04-migrate-cdc.sql
      - ./database/migrate_password_reset.sql:/docker-entrypoint-initdb.d/05-migrate-password-reset.sql
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

networks:
  agri-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
