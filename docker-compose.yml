services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agricultural_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - api
    networks:
      - agri-network
    restart: always

  # Next.js Client
  client:
    build:
      context: ./client/kiduka-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        API_URL: http://api:8000
    container_name: agricultural_client
    ports:
      - "3000:3000"
    networks:
      - agri-network
    environment:
      - API_URL=http://api:8000
      # - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - api
    restart: always

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agricultural_api
    ports:
      - "8000:8000" # Exposed for direct testing (usually via Nginx)
    volumes:
      - ./api:/api
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use postgres service name instead of localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - agri-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agricultural_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432" # Exposed for local development
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrate_to_rbac.sql:/docker-entrypoint-initdb.d/02-migrate.sql
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80" # Keep exposed for admin access, or proxy via Nginx too if desired
    networks:
      - agri-network
    depends_on:
      - postgres

# Explicit network definition
networks:
  agri-network:
    driver: bridge

# Persistent volume for database data
volumes:
  postgres_data:
    driver: local